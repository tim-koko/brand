name: Brand Guide CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24.x]

    steps:
    - name: Check out Brand Guide project
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}

    - name: Install dependencies
      run: npm ci

    - name: Run Brand Guide test script
      run: npm test

    - name: Build production site
      run: npm run build
